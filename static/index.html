<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-ink: #fff; --user: #eef2ff; --tool: #f8fafc; --err: #b91c1c; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --ink: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
            --user: #1e2536; --tool: #12161b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status b { color: var(--ok); font-weight: 600; }
  header button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px;
                  padding: 4px 10px; cursor: pointer; font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 140px; }
  .msg { margin: 12px 0; display: flex; gap: 10px; }
  .msg .who { flex: 0 0 64px; font-size: 12px; color: var(--muted); padding-top: 8px; text-align: right; }
  .msg .body { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
               padding: 10px 14px; overflow-wrap: anywhere; }
  .msg.user .body { background: var(--user); white-space: pre-wrap; }
  .msg .body p { margin: 0 0 8px; } .msg .body p:last-child { margin-bottom: 0; }
  .msg .body table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
  .msg .body th, .msg .body td { border: 1px solid var(--line); padding: 4px 8px; }
  .msg .body code { background: var(--tool); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg .body pre { background: var(--tool); padding: 8px; border-radius: 6px; overflow: auto; }
  .tool { margin: 6px 0 6px 74px; font-size: 12.5px; color: var(--muted); background: var(--tool);
          border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; }
  .tool .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px;
               flex: 0 0 8px; animation: pulse 1s infinite; }
  .tool.done .dot { animation: none; background: var(--ok); }
  .tool.error .dot { animation: none; background: var(--err); }
  .tool .name { font-weight: 600; color: var(--ink); }
  .tool .detail { font-family: Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  /* Shown from the moment a prompt is sent until the agent produces something,
     and again between a tool returning and the next output — the two places the
     UI would otherwise sit silent and look broken. */
  .thinking .body { display: inline-flex; gap: 4px; align-items: center; padding: 14px 12px; }
  .thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
                animation: blink 1.4s infinite both; }
  .thinking i:nth-child(2) { animation-delay: .2s }
  .thinking i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  .report { margin: 10px 0 10px 74px; display: flex; align-items: center; gap: 14px; background: var(--panel);
            border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; }
  .report .icon { width: 36px; height: 44px; border-radius: 4px; background: var(--accent);
                  color: var(--accent-ink); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .report .t { flex: 1; } .report .t .title { font-weight: 600; } .report .t .sub { font-size: 12px; color: var(--muted); }
  .report a { background: var(--accent); color: var(--accent-ink); text-decoration: none; padding: 8px 14px;
              border-radius: 8px; font-weight: 600; font-size: 14px; }
  .error { margin: 8px 0 8px 74px; color: var(--err); font-size: 13px; }
  .meta { margin: 2px 0 8px 74px; font-size: 11.5px; color: var(--muted); }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line);
         padding: 12px 16px; }
  form .row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 200px; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  form button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
                padding: 0 18px; height: 44px; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Report Agent</h1>
  <div class="status" id="status">connecting…</div>
  <button id="newBtn" title="Start a new conversation">New conversation</button>
</header>
<main id="log"></main>
<form id="form">
  <div class="row">
    <textarea id="input" placeholder="Describe the report you need… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
(() => {
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const status = document.getElementById('status');
  let ws = null, cid = null, busy = false;
  let current = null;          // { el, text } for the assistant message being streamed
  const tools = new Map();     // tool_use_id -> element

  // -- tiny markdown renderer (headings, bold/italic, code, lists, tables, links) --
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    const lines = src.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])) {
        const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
        let h = '<table><thead><tr>' + cells(l).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>'; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) h += '<tr>' + cells(lines[i++]).map(c => `<td>${c}</td>`).join('') + '</tr>';
        out.push(h + '</tbody></table>'); continue; }
      const hm = /^(#{1,4})\s+(.*)/.exec(l); if (hm) { out.push(`<h${hm[1].length + 1}>${inline(hm[2])}</h${hm[1].length + 1}>`); i++; continue; }
      if (/^\s*[-*]\s+/.test(l)) { let h = '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) h += '<li>' + inline(lines[i++].replace(/^\s*[-*]\s+/, '')) + '</li>'; out.push(h + '</ul>'); continue; }
      if (/^\s*\d+\.\s+/.test(l)) { let h = '<ol>'; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) h += '<li>' + inline(lines[i++].replace(/^\s*\d+\.\s+/, '')) + '</li>'; out.push(h + '</ol>'); continue; }
      if (l.trim() === '') { i++; continue; }
      const buf = []; while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
      if (buf.length) out.push('<p>' + inline(buf.join(' ')) + '</p>'); else i++;
    }
    return out.join('');
  }

  const scroll = () => window.scrollTo({ top: document.body.scrollHeight });
  function addMsg(who, text) {
    const el = document.createElement('div'); el.className = 'msg ' + who;
    el.innerHTML = `<div class="who">${who === 'user' ? 'You' : 'Agent'}</div><div class="body"></div>`;
    const body = el.querySelector('.body'); if (who === 'user') body.textContent = text; else body.innerHTML = md(text || '');
    log.appendChild(el); scroll(); return el;
  }
  function addTool(ev) {
    const el = document.createElement('div'); el.className = 'tool'; el.dataset.id = ev.id;
    const name = ev.name.replace(/^mcp__[^_]+__/, '');
    el.innerHTML = `<div class="dot"></div><div><span class="name">${esc(name)}</span> <span class="detail">${esc(ev.summary || '')}</span></div>`;
    log.appendChild(el); tools.set(ev.id, el); scroll();
  }
  function addReport(ev) {
    const el = document.createElement('div'); el.className = 'report';
    const kb = ev.size_bytes ? Math.round(ev.size_bytes / 1024) + ' KB · ' : '';
    el.innerHTML = `<div class="icon">PDF</div><div class="t"><div class="title">${esc(ev.title || 'Report')}</div>
      <div class="sub">${kb}${esc(ev.filename || '')}</div></div>
      <a href="${esc(ev.url)}" target="_blank" rel="noopener" download>Download</a>`;
    log.appendChild(el); scroll();
  }
  let thinkingEl = null;
  function showThinking() {
    if (thinkingEl || current) return;
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg agent thinking';
    thinkingEl.innerHTML = '<div class="who">Agent</div><div class="body"><i></i><i></i><i></i></div>';
    log.appendChild(thinkingEl); scroll();
  }
  function hideThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }

  function note(cls, text) { const el = document.createElement('div'); el.className = cls; el.textContent = text; log.appendChild(el); scroll(); }

  function setBusy(b) { busy = b; sendBtn.disabled = b; status.innerHTML = b ? 'working…' : `<b>ready</b> · ${cid ? cid.slice(0, 8) : ''}`; }

  function handle(ev) {
    switch (ev.type) {
      case 'hello': setBusy(false); (ev.reports || []).forEach(addReport);
        if (ev.agent_mode === 'mock') note('meta', 'Running in mock mode (AGENT_MODE=mock): scripted agent, sample data.'); break;
      case 'turn_start': current = null; break;
      case 'text_delta': hideThinking();
        if (!current) current = { el: addMsg('agent', ''), text: '' };
        current.text += ev.text; current.el.querySelector('.body').innerHTML = md(current.text); scroll(); break;
      case 'assistant_text': hideThinking();
        if (!current) current = { el: addMsg('agent', ''), text: '' };
        current.text = ev.text; current.el.querySelector('.body').innerHTML = md(ev.text); current = null; scroll(); break;
      case 'tool_use': hideThinking(); current = null; addTool(ev); break;
      case 'tool_result': { const el = tools.get(ev.tool_use_id); if (el) el.classList.add(ev.is_error ? 'error' : 'done');
        if (ev.is_error) note('error', ev.preview || 'tool error'); showThinking(); break; }
      case 'report': hideThinking(); addReport(ev); break;
      // cost_usd is the SDK's running total for the conversation, not this turn:
      // ResultMessage carries session totals that only reset when the conversation does.
      case 'result': if (ev.cost_usd != null && ev.cost_usd > 0) note('meta', `Turn finished in ${Math.round(ev.duration_ms / 1000)}s · conversation total $${ev.cost_usd.toFixed(3)}`); break;
      case 'error': hideThinking(); note('error', ev.message); break;
      case 'turn_end': hideThinking(); setBusy(false); current = null; break;
    }
  }

  async function start() {
    log.innerHTML = ''; tools.clear(); current = null; thinkingEl = null;
    if (ws) { ws.onclose = null; ws.close(); }
    status.textContent = 'connecting…';
    const r = await fetch('/conversations', { method: 'POST' }); cid = (await r.json()).conversation_id;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${cid}`);
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => { status.textContent = 'disconnected — click New conversation'; sendBtn.disabled = true; };
    ws.onerror = () => note('error', 'connection error');
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault(); const text = input.value.trim(); if (!text || busy || !ws || ws.readyState !== 1) return;
    addMsg('user', text); ws.send(JSON.stringify({ prompt: text })); input.value = ''; input.style.height = ''; setBusy(true); showThinking();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); } });
  input.addEventListener('input', () => { input.style.height = ''; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });
  document.getElementById('newBtn').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
